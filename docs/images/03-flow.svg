<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">SQL PowerTools clone and mask flow</title>
  <desc id="desc">Connect to MySQL, sample tables, mask sensitive columns, review HTML and JSON report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="280" rx="24" fill="url(#bg)"/>
  <text x="40" y="42" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700">Clone + mask flow</text>
  <text x="40" y="68" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="13">No real credentials or PII  illustrative only</text>

  <!-- Step cards -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <rect x="40" y="100" width="180" height="120" rx="16" fill="#111827" stroke="#334155"/>
    <circle cx="68" cy="128" r="14" fill="#38bdf8"/>
    <text x="64" y="133" fill="#0f172a" font-size="14" font-weight="700">1</text>
    <text x="90" y="133" fill="#e2e8f0" font-size="15" font-weight="600">Connect</text>
    <text x="56" y="168" fill="#94a3b8" font-size="12">Host / port / user</text>
    <text x="56" y="188" fill="#94a3b8" font-size="12">Choose source DB</text>

    <rect x="270" y="100" width="180" height="120" rx="16" fill="#111827" stroke="#334155"/>
    <circle cx="298" cy="128" r="14" fill="#34d399"/>
    <text x="294" y="133" fill="#0f172a" font-size="14" font-weight="700">2</text>
    <text x="320" y="133" fill="#e2e8f0" font-size="15" font-weight="600">Sample</text>
    <text x="286" y="168" fill="#94a3b8" font-size="12">Pick tables + row limit</text>
    <text x="286" y="188" fill="#94a3b8" font-size="12">Optional ORDER BY PK</text>

    <rect x="500" y="100" width="180" height="120" rx="16" fill="#111827" stroke="#334155"/>
    <circle cx="528" cy="128" r="14" fill="#fbbf24"/>
    <text x="524" y="133" fill="#0f172a" font-size="14" font-weight="700">3</text>
    <text x="550" y="133" fill="#e2e8f0" font-size="15" font-weight="600">Mask</text>
    <text x="516" y="168" fill="#94a3b8" font-size="12">Auto-detect secrets</text>
    <text x="516" y="188" fill="#94a3b8" font-size="12">Or per-column override</text>

    <rect x="730" y="100" width="190" height="120" rx="16" fill="#111827" stroke="#334155"/>
    <circle cx="758" cy="128" r="14" fill="#c084fc"/>
    <text x="754" y="133" fill="#0f172a" font-size="14" font-weight="700">4</text>
    <text x="780" y="133" fill="#e2e8f0" font-size="15" font-weight="600">Report</text>
    <text x="746" y="168" fill="#94a3b8" font-size="12">HTML copy report</text>
    <text x="746" y="188" fill="#94a3b8" font-size="12">JSON export for CI</text>
  </g>

  <line x1="220" y1="160" x2="270" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="160" x2="500" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="160" x2="730" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
